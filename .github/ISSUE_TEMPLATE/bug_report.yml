name: 🐛 Bug report | Bug 报告
description: Something does not work as expected (crash / wrong behavior / rendering issue) | 某个功能不按预期工作（崩溃 / 行为错误 / 显示异常）
title: '[bug] '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please fill in the **environment snapshot** first — in AIO: Settings → App → Feedback & Support → "Copy environment info", then paste it into the first field below.
        > Mask API keys and conversation content in screenshots; the diagnostics zip is already sanitized.

        感谢反馈！请先填写**环境快照**——在 AIO 中：设置 → 关于与反馈 → 「复制环境信息」，直接粘贴到下面第一格即可。
        > 涉及 API Key、会话内容的截图请先遮挡；诊断包里已自动脱敏。
  - type: textarea
    id: env
    attributes:
      label: Environment snapshot | 环境快照
      description: Settings → App → Feedback & Support → copy environment info (version / OS / tool detection; no keys) | 设置 → 关于与反馈 → 复制环境信息（含版本/系统/工具检测结果，不含任何密钥）
      placeholder: 'AIO v0.8.3 · Windows 11 · en-US · claude: ready · ...'
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Problem area | 问题区域
      options:
        - Chat (messages / models / providers) | 对话（消息流 / 模型 / 供应商）
        - Agent mode (tool calls / permissions / sandbox) | Agent 模式（工具调用 / 权限 / 沙箱）
        - Subagents / task board | 子智能体 / 任务清单
        - Memory / RAG / code index | 记忆 / RAG / 代码索引
        - Harness workbench (CLI tools) | Harness 工作台（CLI 工具）
        - MCP servers | MCP 服务器
        - Local engine (llama.cpp / Ollama / vLLM) | 本地引擎（llama.cpp / Ollama / vLLM）
        - Skills | Skills
        - Settings / provider config | 设置 / 供应商配置
        - App update / install / launch | 应用更新 / 安装 / 启动
        - Other | 其他
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? | 发生了什么？
      description: Expected vs actual behavior, with minimal reproduction steps | 预期行为 vs 实际行为，尽量给出最小复现步骤
      placeholder: |
        Expected: ...
        Actual: ...
        Steps: 1. ... 2. ...

        预期：…
        实际：…
        复现：1. … 2. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots | 日志 / 截图
      description: Drag the diagnostics zip (Settings → App → Feedback & Support → Export diagnostics) into this issue | 诊断包（设置 → 关于与反馈 → 导出诊断包）可直接拖拽上传到本 issue
      placeholder: Optional | 可选
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist | 检查清单
      options:
        - label: I am on the latest alpha build (the issue still reproduces) | 我已安装最新 alpha 版本（问题在新版本中仍存在）
          required: true
        - label: I searched existing Issues / Discussions and found no duplicate | 我在现有 Issues / Discussions 中搜索过，没有重复
          required: true
