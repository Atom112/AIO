name: 🐛 Bug 报告
description: 某个功能不按预期工作（崩溃 / 行为错误 / 显示异常）
title: '[bug] '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先填写**环境快照**——在 AIO 中：设置 → 关于与反馈 → 「复制环境信息」，直接粘贴到下面第一格即可。
        > 涉及 API Key、会话内容的截图请先遮挡；诊断包里已自动脱敏。
  - type: textarea
    id: env
    attributes:
      label: 环境快照
      description: 设置 → 关于与反馈 → 复制环境信息（含版本/系统/工具检测结果，不含任何密钥）
      placeholder: 'AIO v0.8.3 · Windows 11 · zh-CN · claude: ready · ...'
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - 对话（消息流 / 模型 / 供应商）
        - Agent 模式（工具调用 / 权限 / 沙箱）
        - 子智能体 / 任务清单
        - 记忆 / RAG / 代码索引
        - Harness 工作台（CLI 工具）
        - MCP 服务器
        - 本地引擎（llama.cpp / Ollama / vLLM）
        - Skills
        - 设置 / 供应商配置
        - 应用更新 / 安装 / 启动
        - 其他
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 预期行为 vs 实际行为，尽量给出最小复现步骤
      placeholder: |
        预期：…
        实际：…
        复现：1. … 2. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 诊断包（设置 → 关于与反馈 → 导出诊断包）可直接拖拽上传到本 issue
      placeholder: 可选
  - type: checkboxes
    id: checks
    attributes:
      label: 检查清单
      options:
        - label: 我已安装最新 alpha 版本（问题在新版本中仍存在）
          required: true
        - label: 我在现有 Issues / Discussions 中搜索过，没有重复
          required: true
