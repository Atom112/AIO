name: CI

# PR / dev push 验证管线 —— 与 `npm run verify` 同一套基线。
# 前端在 ubuntu 上单跑；Rust 跑三平台矩阵——cfg 分支各自在本平台编译，
# 跨平台 dead-code/lint 才各自暴露（Linux runner 抓不到 Windows 分支的
# 问题，反之亦然）；Windows 的 AppContainer 沙箱测试自 0.8.3 起「先运行
# 后判定」，受限环境自动 [SKIP]。models-data 检出与 release.yml 同一
# pin，保证 CI 与发布构建素材一致。

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MODELS_DATA_REF: b314a90bb979da07e654bb995aa44cff26476cfe

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout AIO
        uses: actions/checkout@v4

      - name: Checkout models data
        shell: bash
        run: |
          MODELS_DATA_DIR="${GITHUB_WORKSPACE}/../aio-models-data"
          rm -rf "$MODELS_DATA_DIR"
          git clone --no-checkout https://github.com/Atom112/aio-models-data.git "$MODELS_DATA_DIR"
          git -C "$MODELS_DATA_DIR" checkout "$MODELS_DATA_REF"
          test -f "$MODELS_DATA_DIR/dist/data/models.json"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify bundled model catalog
        shell: bash
        run: test -f node_modules/@aio/models-data/dist/data/models.json

      - name: Frontend checks (i18n / docs / gates / lint / types / tests / build)
        run: npm run check:frontend

  rust:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout AIO
        uses: actions/checkout@v4

      - name: Checkout models data
        shell: bash
        run: |
          MODELS_DATA_DIR="${GITHUB_WORKSPACE}/../aio-models-data"
          rm -rf "$MODELS_DATA_DIR"
          git clone --no-checkout https://github.com/Atom112/aio-models-data.git "$MODELS_DATA_DIR"
          git -C "$MODELS_DATA_DIR" checkout "$MODELS_DATA_REF"
          test -f "$MODELS_DATA_DIR/dist/data/models.json"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js (tauri resource bundling)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust checks (fmt / clippy / tests)
        run: npm run check:rust
