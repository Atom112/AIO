[package]
name = "aio"
version = "0.8.0"
description = "A lightweight cross-platform AI assistant desktop client"
authors = ["Loch"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.97"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Version alignment: the tauri crate minor MUST match the @tauri-apps/api npm
# package minor (tauri-build's check fails the build on drift — the npm side is
# locked to ~2.12). Plugin crate minors likewise match their npm packages
# (~2.7 opener / ~2.7 dialog). Keep this table in sync with package.json.
tauri = { version = "2.12", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2.7"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Config-file validation for the harness tool settings pages (codex config.toml,
# goose/omp/dsh yaml). Value-level parse only — comment-preserving edits use
# toml_edit when the structured form lands.
toml = "0.8"
serde_yaml = "0.9"
dirs = "6.0"
reqwest = { version = "0.13", features = ["json", "stream", "blocking"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
pdf-extract = "0.12"
zip = "4.6"
xml-rs = "0.8"
encoding_rs = "0.8"
dashmap = "6.0"
once_cell = "1"
parking_lot = "0.12"
tauri-plugin-dialog = "2.7.1"
uuid = { version = "1", features = ["v4", "fast-rng", "serde"] }
base64 = "0.22.1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
url = "2"
percent-encoding = "2"
regex = "1"
glob = "0.3"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
lsp-types = "0.97"
tiktoken-rs = "0.6"
auto-launch = "0.6"
sqlite-vec = "0.1.9"
sysinfo = "0.33"
fastembed = { version = "4", default-features = false, features = ["ort-download-binaries"] }
# ACP wire types for the harness workbench (CLI-agent GUI compatibility layer).
# Types-only usage (default features = none): AIO owns the transport (tokio child
# stdio + utils/jsonrpc.rs), the crate supplies the serde v1 schema shapes.
# Pinned to ~3.3: the crate majors land roughly quarterly — upgrades are deliberate.
agent-client-protocol = { version = "~3.3", default-features = false }

[dev-dependencies]
# http is already in the dependency tree via reqwest 0.13 (same major version);
# declaring it lets the download kill-recovery tests build synthetic 206
# responses (reqwest::Response: From<http::Response>) without a live server.
http = "1"
# test-util (NOT part of tokio "full") enables #[tokio::test(start_paused)] for the
# StreamManager generation tests — auto-advancing time makes the sleep-based
# replacement-window sequencing deterministic and instant. Dev-only: the release
# build keeps the lean runtime.
tokio = { version = "1", features = ["test-util"] }
